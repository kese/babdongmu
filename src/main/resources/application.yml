server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  packages-to-scan: com.example.capstone.api
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  project-id: ${FIREBASE_PROJECT_ID:}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}

# 파일 업로드 설정
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# 프로필 이미지 업로드 설정
# upload-dir: 파일이 저장될 기본 디렉토리 (하위에 profile/ 폴더 자동 생성)
# base-url: 외부 접근 URL (예: https://api.example.com), 빈 값이면 상대 경로 사용
file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  base-url: ${FILE_BASE_URL:}

