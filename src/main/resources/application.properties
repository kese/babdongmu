spring.application.name=CapstoneServer

# ================= MariaDB DataSource =================
# Database access is disabled until an operator supplies dedicated environment values.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ================= JPA/Hibernate =================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# ================= Logging =================
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# ================= SQL Initialization =================
# Ensure schema SQL runs on external DB at startup
#spring.sql.init.mode=always
#spring.sql.init.schema-locations=classpath:sql/create_users_table.sql
spring.jpa.defer-datasource-initialization=true
